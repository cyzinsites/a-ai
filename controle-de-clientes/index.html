<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3d1a4f">
<title>Controle de Clientes • Açaí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <header class="topo">
    <div class="marca">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C7 6 5 10 5 14a7 7 0 0 0 14 0c0-4-2-8-7-12z"></path>
        </svg>
      </div>
      <div class="marca-texto">
        <h1>Controle de Clientes</h1>
      </div>
    </div>
  </header>

  <!-- RESUMO -->
  <section class="cards" aria-label="Resumo">
    <article class="card">
      <span class="card-label">Clientes</span>
      <strong class="card-valor" id="totalClientes">0</strong>
    </article>
    <article class="card">
      <span class="card-label">Total em fiado</span>
      <strong class="card-valor" id="totalValor">R$ 0,00</strong>
    </article>
  </section>

  <!-- FORMULARIO -->
  <section class="painel" aria-label="Cadastrar cliente">
    <h2 class="painel-titulo">Novo registro</h2>
    <form class="formulario" id="form" autocomplete="off">
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Ex: Maria Silva">
      </div>
      <div class="campo">
        <label for="numero">Número</label>
        <input type="text" id="numero" placeholder="(00) 00000-0000" inputmode="tel">
      </div>
      <div class="campo">
        <label for="companhia">Companhia</label>
        <input type="text" id="companhia" placeholder="Empresa">
      </div>
      <div class="campo">
        <label for="cargo">Cargo</label>
        <input type="text" id="cargo" placeholder="Função">
      </div>
      <div class="campo">
        <label for="valor">Valor da compra</label>
        <input type="number" id="valor" placeholder="0,00" inputmode="decimal" step="0.01" min="0">
      </div>
      <button type="submit" class="btn-salvar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Salvar
      </button>
    </form>
  </section>

  <!-- BUSCA -->
  <div class="busca">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="pesquisa" placeholder="Pesquisar por nome, número, companhia..." onkeyup="filtrar()" aria-label="Pesquisar clientes">
  </div>

  <!-- TABELA (desktop) -->
  <section class="tabela-wrap" aria-label="Lista de clientes">
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Número</th>
          <th>Companhia</th>
          <th>Cargo</th>
          <th>Valor</th>
          <th>Data</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabela"></tbody>
    </table>
  </section>

  <!-- CARDS (mobile) -->
  <section class="lista-mobile" id="listaMobile" aria-label="Lista de clientes (mobile)"></section>

  <!-- VAZIO -->
  <div class="vazio" id="vazio" hidden>
    <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2C7 6 5 10 5 14a7 7 0 0 0 14 0c0-4-2-8-7-12z"/></svg>
    <p>Nenhum cliente por aqui ainda.</p>
    <span>Cadastre o primeiro registro no formulário acima.</span>
  </div>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
